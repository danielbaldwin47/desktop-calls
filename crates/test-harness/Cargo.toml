[package]
name = "test-harness"
description = "Test harness for Desktop Calls: private buses, a temporary home and desktop stand-ins. Used only by tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Every scenario file in tests/ is a module of one test binary, listed by
# build.rs (#118), rather than a binary of its own.
autotests = false

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"

# The names the files had as binaries of their own: `cargo test --test <name>`
# fails with a pointer to `just test-file <name>`, rather than running nothing
# (tests/moved/pointer.rs). Never run by a whole `cargo test`.
# New files need no entry.
[[test]]
name = "answered_on_phone_surfaces"
path = "tests/moved/answered_on_phone_surfaces.rs"
harness = false
test = false

[[test]]
name = "call_window_keyboard"
path = "tests/moved/call_window_keyboard.rs"
harness = false
test = false

