[package]
name = "automation"
description = "Automation for Desktop Calls: the scorecard runner, the Real-Phone Checklist runner and the screenshot gallery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# The gallery and the demo run the app in the test harness's world.
test-harness = { path = "../test-harness" }
# `just demo` outlives Ctrl-C long enough to clean up its scenario.
signal-hook = "0.4"
# The Real-Phone Checklist runner watches the app's control interface,
# and writes and reads its dated result files.
zbus = { workspace = true, features = ["default-rt"] }
futures-util.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
