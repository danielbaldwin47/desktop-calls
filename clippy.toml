# Tests may unwrap and expect; production code may not (CODING_STANDARDS.md).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Proper names that docs use as words, not code. `..` keeps clippy's defaults.
doc-valid-idents = ["PipeWire", "BlueZ", "GLib", "GVariant", "AudioGateway", "AudioGateways", ".."]
