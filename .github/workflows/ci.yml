name: CI

on:
  # Pull requests run on pull_request only. Triggering on every push too
  # ran CI twice per PR push, in different concurrency groups.
  push:
    branches: [main]
  pull_request:
  # `gh workflow run CI --ref <branch> -f keep_scenario_logs=true` keeps the
  # logs of passing scenarios too, to compare them with failing ones.
  workflow_dispatch:
    inputs:
      keep_scenario_logs:
        description: Keep the logs of passing scenarios too
        type: boolean
        default: false

permissions:
  contents: read

# The harness keeps a passing scenario's directory too when this is set (see
# KEEP_SCENARIO_LOGS in crates/test-harness/src/lib.rs). Failing scenarios
# always keep theirs.
env:
  KEEP_SCENARIO_LOGS: ${{ inputs.keep_scenario_logs && '1' || '' }}

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main: a later wiki push must not cancel the run that
  # verifies a merge (it did on 2026-11-05, for #41).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# `changes` decides whether the change touches code. If it does, the suite
# runs in parallel, on several runners: `just lint`; every test but the
# harness's scenarios; and the harness's scenarios, split into shards. The
# test jobs build every target between them, as `just check` does. If it
# touches only docs that no code reads, they are all skipped. "CI passed"
# needs every job, so it appears only once they have all finished.
jobs:
  changes:
    name: Code changed?
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Both ends of the change, to compare them.
          fetch-depth: 0

      # The rule is in tools/changes.py, which `just merge` uses too.
      - name: Decide whether code changed
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  # `just check` is `just lint` and then a build of every target. CI runs
  # `just lint` in a job of its own, beside the tests rather than before
  # them: the test jobs build every target between them, so its build would
  # be a third one, a minute spent on the harness's tests, which this job
  # never ran (#118).
  lint:
    name: just lint (just check but its build, which the test jobs do)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      # The system libraries the -sys crates' build scripts look for, but
      # none of the scenarios' tools.
      - name: Install system packages
        run: >-
          pacman -Syu --noconfirm --needed
          gcc pkgconf git rustup just cargo-deny python
          gtk4 gtk4-layer-shell libadwaita dbus
      - uses: actions/checkout@v5
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: just lint
        run: just lint

  check:
    name: just test, all but the harness's scenarios
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Arch Linux, to match the user's Desktop (Omarchy).
    container: &container
      image: archlinux:latest
      # Headless sway and grim keep each 3840x2160 frame (33 MB) in /dev/shm,
      # and screen scenarios run several at a time. Docker's default 64 MB ran
      # out: grim died of SIGBUS and sway failed to start.
      options: --shm-size=1g
    steps:
      # gcc links, and pkgconf finds the system libraries; base-devel's other
      # tools (make, gdb, guile, perl's autotools) aren't needed. sway is the
      # screen harness's headless compositor, grim its screenshot tool,
      # wl-clipboard its clipboard for pasting, and libnotify's notify-send a
      # client of the notification stand-in. python-dbus and python-gobject
      # let the Real-Phone Checklist's --demo run the PBAP probe
      # (tools/real-phone) against the Simulated Phone. cargo-nextest runs
      # the harness's shards. Every job runs scenarios, so each installs
      # everything.
      - &install
        name: Install system packages
        run: >-
          pacman -Syu --noconfirm --needed
          gcc pkgconf git rustup just cargo-deny cargo-nextest
          gtk4 gtk4-layer-shell libadwaita dbus python python-dbus python-gobject
          sway grim wl-clipboard libnotify

      - &checkout
        uses: actions/checkout@v5

      - &toolchain
        name: Install the pinned Rust toolchain
        # rustup reads rust-toolchain.toml.
        run: rustup toolchain install

      # rust-cache keys on Cargo.lock and the crates' manifests, but not the
      # workspace's Cargo.toml. A change to its build profiles then restored
      # a cache that matched in name only: every dependency rebuilt, and the
      # cache was never saved again. Its hash goes in the key.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}

      # The package gives sway the file capability cap_sys_nice, which is
      # outside this container's bounding set, so exec fails with EPERM.
      # sway runs without it; only its realtime scheduling goes.
      - &sway
        name: Let sway run in the container
        run: setcap -r /usr/bin/sway

      # The gallery test renders the gallery exactly as `just screenshot` does,
      # into target/screenshots/gallery, so CI doesn't render it twice.
      - name: just test, all but the harness's scenarios
        run: just test --exclude test-harness

      - name: just scorecard
        run: just scorecard | tee scorecard.txt

      - name: Keep the gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: target/screenshots
          if-no-files-found: ignore

      - name: Keep the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.txt
          if-no-files-found: ignore

      # Every scenario directory left: those of failed scenarios, and of
      # passing ones too when KEEP_SCENARIO_LOGS is set. `just ci-wait`
      # downloads them.
      - name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs-check
          path: /tmp/desktop-calls-test-*
          if-no-files-found: ignore

  # The harness's scenarios, in SHARDS shards on as many runners at once.
  # cargo-nextest pools every test binary's scenarios, rather than running
  # the binaries one after another and each waiting on its slowest scenario,
  # and `--partition count:k/SHARDS` gives each shard every SHARDS-th one, so
  # a new scenario lands in a shard without anyone listing it. In run
  # 42034428129, one runner took 326 s under `cargo test` and 231 s under
  # nextest, with two at a time either way (#118).
  scenarios:
    name: just test, the harness's scenarios (shard ${{ matrix.shard }} of 4)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: *container
    # A hung scenario fails after nextest's terminate-after (.config/nextest.toml),
    # long before this; this only bounds a hang outside a test.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one failure doesn't hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - *install
      - *checkout
      - *toolchain
      # The shards share one cache, which only the first saves.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ matrix.shard == 1 }}
      - *sway

      # Records whether unprivileged user and mount namespaces work here. The
      # harness uses them only to hide a reachable systemd journal from the
      # app, so its log lands in the scenario directory.
      - name: Probe unshare -rm
        run: |
          ls -l /run/systemd/journal/socket || echo "No journal socket: the app logs to its file without help."
          if unshare -rm true; then echo "unshare -rm: works"; else echo "unshare -rm: refused"; fi

      # Scenarios run the built binaries, as in `just test`. As many at once
      # as the runner has CPUs, as `cargo test` does: four at a time on two
      # CPUs failed Banner and Handoff timings in run 42034428129.
      - name: Build the binaries the scenarios run
        run: cargo build --workspace --bins --locked

      - name: just test, the harness's scenarios, shard ${{ matrix.shard }} of 4
        run: >-
          cargo nextest run -p test-harness --locked --no-fail-fast
          --partition count:${{ matrix.shard }}/4

      # First-frame timings, judged one scenario at a time as on the Desktop,
      # which runs one app (issue #47). In the whole run above, every
      # scenario's app at once slows each first paint past its target. Only
      # the first shard runs them.
      - name: just test, first-frame timings one scenario at a time
        if: matrix.shard == 1
        run: >-
          cargo test -p test-harness --locked
          --test dialer_surface --test incoming_call_surfaces
          -- --ignored --test-threads=1

      # Every screenshot a screen scenario took.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: target/screenshots
          if-no-files-found: ignore

      - name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs-${{ matrix.shard }}
          path: /tmp/desktop-calls-test-*
          if-no-files-found: ignore

  # The one check that says CI passed. It fails unless `changes` succeeded and
  # both halves succeeded, or were skipped because `changes` found only docs.
  # `just merge` waits on every check and every unfinished run.
  ci-passed:
    name: CI passed
    if: ${{ !cancelled() }}
    needs: [changes, lint, check, scenarios]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped for a docs-only change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          HALVES: ${{ needs.lint.result }} ${{ needs.check.result }} ${{ needs.scenarios.result }}
        run: |
          echo "changes: $CHANGES, code changed: $CODE, halves: $HALVES"
          [ "$CHANGES" = success ] || exit 1
          for result in $HALVES; do
            if [ "$CODE" = true ]; then
              [ "$result" = success ] || exit 1
            else
              [ "$result" = skipped ] || exit 1
            fi
          done
