name: CI

on:
  # Every PR to main is gated here: GitHub's own "CI passed" job posts the
  # check branch protection requires, on the PR's head (#286; from #158 to
  # #286 a local run posted it instead).
  pull_request:
    branches: [main]
  # And again on main after each merge, which tests what landed.
  push:
    branches: [main]
  # `gh workflow run CI --ref <branch> -f keep_scenario_logs=true` keeps the
  # logs of passing scenarios too, to compare them with failing ones. Its
  # summary job is named differently (below), so it never stands in for the
  # check on a PR.
  workflow_dispatch:
    inputs:
      keep_scenario_logs:
        description: Keep the logs of passing scenarios too
        type: boolean
        default: false

permissions:
  contents: read
  # To pull CI's image from GitHub's container registry.
  packages: read

# The harness keeps a passing scenario's directory too when this is set (see
# KEEP_SCENARIO_LOGS in crates/test-harness/src/lib.rs). Failing scenarios
# always keep theirs.
env:
  KEEP_SCENARIO_LOGS: ${{ inputs.keep_scenario_logs && '1' || '' }}

# A newer push to a PR cancels that PR's older run, which tested a head that
# can no longer merge. A run on main is in a group of its own, so it is never
# cancelled and never waits for another run: with one group for main, a
# 6-hour hung run held every later push to main pending, and each newer push
# replaced the pending one, so 12 runs on main were cancelled on 2026-11-14
# and run 43648375459 waited 5 h to start (#286).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `setup` decides whether the change touches code, and makes sure CI's image
# exists. If code changed, the suite runs in parallel, on several runners:
# `just lint`; the tests outside the harness, in two parts; the Real-Phone Checklist's
# group 6 runs (on main); the gallery, in parts; and the harness's
# scenarios, in shards. On main, the polish scorecard follows
# the shards. If only docs that no code reads changed, they are all skipped.
# "CI passed" needs every job, so it appears only once they have all
# finished. The slowest job sets the time from push to "CI passed": on a PR,
# a scenario shard; on main, the checklist's group 6, which waits out real
# minutes.
jobs:
  setup:
    name: Code changed? And CI's image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      code: ${{ steps.decide.outputs.code }}
      image: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Both ends of the change, to compare them.
          fetch-depth: 0
          # The PR's tools/changes.py runs here, and this job's token can
          # write packages: keep the token out of .git/config.
          persist-credentials: false

      # The rule is in tools/changes.py, which `just merge` uses too. A PR is
      # compared from where it left main; a push from the commit before it.
      - name: Decide whether code changed
        id: decide
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

      # Built only when .github/ci-image/Containerfile or rust-toolchain.toml
      # changes, since the tag is their hash; otherwise this finds it.
      - name: Name the image
        id: name
        env:
          TAG: ${{ hashFiles('.github/ci-image/Containerfile', 'rust-toolchain.toml') }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-ci:$TAG" >> "$GITHUB_OUTPUT"
      - name: Build and push the image, unless it exists
        env:
          IMAGE: ${{ steps.name.outputs.name }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists."
          else
            # Every job pulls the image, 600 MB: its layers go up compressed
            # with zstd, 19% smaller than gzip and faster to unpack (#410).
            # Docker's own builder can't choose the compression; buildx's
            # container builder can, made here so a run that finds the image
            # doesn't spend 11 s on it.
            docker buildx create --use --driver docker-container
            # The Containerfile copies in only rust-toolchain.toml.
            context=$(mktemp -d)
            cp rust-toolchain.toml "$context"
            docker buildx build --file .github/ci-image/Containerfile \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --output "type=image,name=$IMAGE,push=true,oci-mediatypes=true,compression=zstd,compression-level=19,force-compression=true" \
              "$context"
          fi

  # `just check` is `just lint` and then a build of every target. CI runs
  # `just lint` in a job of its own, beside the tests rather than before
  # them: the test jobs build every target between them, so its build would
  # be one more, a minute spent on the harness's tests, which this job never
  # ran (#118).
  lint:
    name: just lint (just check but its build, which the test jobs do)
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Green in about a minute.
    timeout-minutes: 15
    container: &container
      image: ${{ needs.setup.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # Headless sway and grim keep each 3840x2160 frame (33 MB) in /dev/shm,
      # and screen scenarios run several at a time. Docker's default 64 MB ran
      # out: grim died of SIGBUS and sway failed to start.
      options: --shm-size=1g
    steps:
      - &checkout
        uses: actions/checkout@v5
        # Two commits, so `just lint`'s bound-change check (#398) can diff a
        # PR's merge commit, or main's push, against its first parent.
        with:
          fetch-depth: 2
      # rust-cache keys on Cargo.lock and the crates' manifests, but not the
      # workspace's Cargo.toml. A change to its build profiles then restored
      # a cache that matched in name only: every dependency rebuilt, and the
      # cache was never saved again. Its hash goes in the key. Only runs on
      # main save: a PR restores main's cache, and caches saved by PRs would
      # evict it from the repository's 10 GB.
      - &cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: just lint
        env: { GH_TOKEN: "${{ github.token }}" }
        run: just lint

  # Every test outside the harness's scenarios but the gallery and the
  # checklist's group 6 runs, which have jobs of their own: together the
  # three are `just test --exclude test-harness`, which took 12 minutes in
  # one job (run 43648375459: 402 s of gallery, 219 s of checklist). In two
  # parts, the justfile's ci_tests_part_2 and the rest: in one, they were the
  # slowest job of a PR's run (225 s of run 43791000134, #410).
  tests:
    name: just ci-tests, all but the scenarios, the gallery and checklist group 6 (part ${{ matrix.part }} of 2)
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: *container
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - *checkout
      - *cache
      # The container runs as root, and the checkout belongs to the runner's
      # user, so git refuses the repository as of dubious ownership. The
      # scorecard reads git object ids for item 8, and its tests do too.
      - &git-trusts-checkout
        name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: just ci-tests ${{ matrix.part }}/2
        run: just ci-tests ${{ matrix.part }}/2
      # Every scenario directory left: those of failed scenarios, and of
      # passing ones too when KEEP_SCENARIO_LOGS is set. `just ci-wait`
      # downloads them.
      - &scenario-logs
        name: Keep the scenario logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-logs-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}${{ matrix.names && format('-{0}', matrix.names) || '' }}${{ matrix.part && format('-{0}', matrix.part) || '' }}
          path: /tmp/desktop-calls-test-*
          if-no-files-found: ignore

  # The Real-Phone Checklist's demo runs of group 6 wait out real time:
  # calls stay off for 60 s, and Quiet Hours begin at the next minute and
  # end a minute later. Its three tests took 157, 157 and 60 s; two at a
  # time on one runner, 217 s, the slowest job of run 43675318041. So one
  # 157 s test gets a runner of its own, and the other two share one. The
  # names, between them, are the justfile's checklist_group_6_tests.
  #
  # Only on main, not on PRs: it was the slowest job of a PR's run (4 min 50 s
  # of run 43677761934, the rest done by 4 min 2 s), and it tests the
  # checklist's demo runner, which the scenarios' Calls Off and Quiet Hours
  # tests don't need (#286, 2026-11-15).
  checklist:
    name: just ci-checklist-group-6 ${{ matrix.names }}
    needs: setup
    if: needs.setup.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: *container
    strategy:
      fail-fast: false
      matrix:
        names: [group_6_times, step_6_2_]
    steps:
      - *checkout
      - *cache
      - name: just ci-checklist-group-6 ${{ matrix.names }}
        run: just ci-checklist-group-6 ${{ matrix.names }}
      - *scenario-logs

  # The gallery, every surface in every state, in parts: each renders every
  # N-th state. A PR's run renders the light stock look only, enough to catch
  # a broken surface (the Omarchy theme has scenarios of its own); the run on
  # main renders every look, light and dark, stock and under Omarchy.
  gallery:
    name: just ci-gallery (part ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A part takes about 2.5 minutes. Without a limit, a hung gallery held a
    # job for GitHub's 6 h default (#282).
    timeout-minutes: 20
    container: *container
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *checkout
      - *cache
      - name: just ci-gallery ${{ matrix.shard }}/${{ strategy.job-total }}
        run: just ci-gallery ${{ matrix.shard }}/${{ strategy.job-total }} ${{ github.event_name == 'pull_request' && 'light' || '' }}
      - name: Keep the gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-${{ matrix.shard }}
          path: target/screenshots
          if-no-files-found: ignore
      - *scenario-logs

  # The harness's scenarios, in one shard per matrix entry, on as many runners
  # at once. cargo-nextest pools every scenario, rather than one slow
  # scenario holding the other CPUs idle, and `--partition count:k/N` gives
  # shard k every N-th one, so a new scenario lands in a shard without anyone
  # listing it. N is the matrix's size, so adding or dropping a shard keeps
  # every scenario in one; "CI passed" checks that the shards' counts add up.
  # In run 42034428129, one runner took 326 s under `cargo test` and 231 s
  # under nextest, with two at a time either way (#118). Six shards, not
  # five: each shard's scenarios took up to 93 s of five (run 43721020495).
  # More shards finish sooner alone but queue longer: every job of every
  # run counts against the account's 20 at once, and each spends about a
  # minute starting and building before its first scenario. The slowest
  # scenario, 48 s, is the floor.
  scenarios:
    name: just test, the harness's scenarios (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    needs: setup
    if: needs.setup.outputs.code == 'true'
    runs-on: ubuntu-latest
    container: *container
    # A hung scenario fails after nextest's terminate-after (.config/nextest.toml),
    # long before this; this only bounds a hang outside a test.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one failure doesn't hide another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - *checkout
      - *cache

      # Scenarios run the built binaries, as in `just test`. As many at once
      # as the runner has CPUs, as `cargo test` does: four at a time on two
      # CPUs failed Banner and Handoff timings in run 42034428129.
      # `just ci-scenarios` builds them, then runs this shard.
      - name: just ci-scenarios, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: just ci-scenarios --partition count:${{ matrix.shard }}/${{ strategy.job-total }}

      # How many scenarios this shard ran and, from the first, how many there
      # are, for "CI passed" to check that the shards ran every one.
      - name: Count this shard's scenarios
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mkdir -p target/shard-counts
          cargo nextest list -p test-harness --locked --message-format oneline \
            --partition "count:$SHARD/$SHARDS" | wc -l > "target/shard-counts/shard-$SHARD"
          if [ "$SHARD" = 1 ]; then
            cargo nextest list -p test-harness --locked --message-format oneline \
              | wc -l > target/shard-counts/every-scenario
          fi
          cat target/shard-counts/*

      - name: Keep this shard's count
        uses: actions/upload-artifact@v4
        with:
          name: shard-count-${{ matrix.shard }}
          path: target/shard-counts

      # Each scenario's result (.config/nextest.toml), for the scorecard job.
      - name: Keep this shard's results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scenario-results-${{ matrix.shard }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

      # First-frame timings, judged one scenario at a time as on the Desktop,
      # which runs one app (issue #47). In the whole run above, every
      # scenario's app at once slows each first paint past its target. Only
      # the first shard runs them: a job of their own cost one more build,
      # 190 s of runner time, for 20 s off this shard (run 43786693313).
      - name: just ci-first-frame-timings
        if: matrix.shard == 1
        run: just ci-first-frame-timings

      # Every screenshot a screen scenario took.
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: target/screenshots
          if-no-files-found: ignore

      - *scenario-logs

  # The polish scorecard (#27), from the scenario shards' results: a report,
  # not a gate, so only the run on main makes it and "CI passed" doesn't
  # wait for it. It runs after the shards, whether or not they passed, so a
  # failing scenario shows as its item's FAIL.
  scorecard:
    name: just scorecard, from the scenarios' results
    needs: [setup, scenarios]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.setup.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: *container
    steps:
      - *checkout
      - *cache
      - *git-trusts-checkout
      - name: Fetch the shards' results
        uses: actions/download-artifact@v4
        with:
          pattern: scenario-results-*
          path: scenario-results
      - name: Score
        env:
          GALLERY: "artifacts gallery-1 to gallery-3 of ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -o pipefail
          cargo build --quiet -p automation --locked
          target/debug/automation scorecard --scenarios scenario-results --gallery "$GALLERY" | tee scorecard.txt
      - name: Keep the scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: scorecard.txt
          if-no-files-found: ignore

  # The one check that says CI passed, and the context branch protection
  # requires, pinned to GitHub Actions. It fails unless `setup` succeeded
  # and every other job succeeded, or was skipped because `setup` found only
  # docs, or, for the checklist, because the run is a PR's. `just merge` and
  # `just land` wait for it.
  ci-passed:
    name: ${{ github.event_name == 'workflow_dispatch' && 'CI passed (dispatched run)' || 'CI passed' }}
    if: ${{ !cancelled() }}
    needs: [setup, lint, tests, checklist, gallery, scenarios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was skipped for a docs-only change
        env:
          SETUP: ${{ needs.setup.result }}
          CODE: ${{ needs.setup.outputs.code }}
          JOBS: >-
            ${{ needs.lint.result }} ${{ needs.tests.result }}
            ${{ needs.gallery.result }} ${{ needs.scenarios.result }}
          CHECKLIST: ${{ needs.checklist.result }}
          PR: ${{ github.event_name == 'pull_request' }}
        run: |
          echo "setup: $SETUP, code changed: $CODE, jobs: $JOBS, checklist: $CHECKLIST"
          [ "$SETUP" = success ] || exit 1
          for result in $JOBS; do
            if [ "$CODE" = true ]; then
              [ "$result" = success ] || exit 1
            else
              [ "$result" = skipped ] || exit 1
            fi
          done
          if [ "$CODE" = true ] && [ "$PR" != true ]; then
            [ "$CHECKLIST" = success ] || exit 1
          else
            [ "$CHECKLIST" = skipped ] || exit 1
          fi

      # A shard that didn't run, or a partition that left scenarios out, would
      # otherwise pass by running fewer.
      - name: Fetch the shards' counts
        if: needs.setup.outputs.code == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-count-*
          merge-multiple: true
          path: shard-counts

      - name: The shards ran every scenario
        if: needs.setup.outputs.code == 'true'
        run: |
          every=$(cat shard-counts/every-scenario)
          ran=$(cat shard-counts/shard-* | awk '{ sum += $1 } END { print sum + 0 }')
          echo "The shards ran $ran of $every scenarios."
          [ "$ran" -eq "$every" ]
