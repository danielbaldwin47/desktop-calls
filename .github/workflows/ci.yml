name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    # Arch Linux, to match the user's Desktop (Omarchy).
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel git rustup just cargo-deny
          gtk4 gtk4-layer-shell libadwaita dbus python

      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        # rustup reads rust-toolchain.toml.
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: just check
        run: just check

      # Records whether unprivileged user and mount namespaces work here. The
      # harness uses them only to hide a reachable systemd journal from the
      # app, so its log lands in the scenario directory.
      - name: Probe unshare -rm
        run: |
          ls -l /run/systemd/journal/socket || echo "No journal socket: the app logs to its file without help."
          if unshare -rm true; then echo "unshare -rm: works"; else echo "unshare -rm: refused"; fi

      - name: just test
        run: just test

      - name: Keep the logs of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-scenario-logs
          path: /tmp/desktop-calls-test-*
          if-no-files-found: ignore
