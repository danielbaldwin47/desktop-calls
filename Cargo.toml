[workspace]
resolver = "3"
members = [
    "crates/desktop-calls",
    "crates/core",
    "crates/simulated-phone",
    "crates/test-harness",
    "crates/automation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/danielbaldwin47/desktop-calls"
publish = false

[workspace.dependencies]
desktop-calls-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
# zbus's own `tracing` feature stays off: its events would carry no `event_kind`.
zbus = { version = "6.2.1", default-features = false, features = ["proxy", "service", "object-manager"] }
glib = { version = "0.22", default-features = false, features = ["futures"] }
glib-unix = "0.22"
socket2 = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-channel = "0.3"
# The Desktop surfaces: the Incoming Call Banner and the Call Window.
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
adw = { version = "0.9", package = "libadwaita" }
gtk4-layer-shell = "0.8"
# Reads the Omarchy theme's colors.toml.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Formats phone numbers for reading, by libphonenumber's rules.
phonenumber = "0.3"
tempfile = "3"
# Reads the harness's screenshots, to find surfaces on screen.
png = "0.18"
# The test harness's synthetic keyboard and pointer, and its test client.
wayland-client = "0.31"
# Only to route wayland-backend's error messages through `log`, which has no
# logger here: by default it prints them, such as "Broken pipe" when `just demo`
# stops, though the harness reports every error itself.
wayland-backend = { version = "0.3", features = ["log"] }
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Every crate opts in with `[lints] workspace = true`. See CODING_STANDARDS.md.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed inside #[cfg(test)] and #[test] code by clippy.toml.
unwrap_used = "deny"
expect_used = "deny"
# Suppress a lint only with `#[expect(lint, reason = "...")]`.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# The regex compiler, optimised even in debug builds. libphonenumber compiles
# its metadata's patterns when it loads, and unoptimised that took 0.27 s on
# the Desktop and over a second on a CI runner (41 ms in a release build), so
# debug builds, which the scenario tests run, missed the 1 s Banner target.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

# The screen harness's PNG decoding and pixel scans, optimised even in debug
# builds. Unoptimised, checking one 3840x2160 screenshot took about 0.6 s of
# one CPU here and several seconds on a loaded one, so a screen scenario
# could miss a 5 s deadline after only a couple of captures; optimised it
# takes about 16 ms. `region_where` is generic, so it compiles into the crate
# that calls it: the harness's own tests, and the gallery in automation.
[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

# The harness and the gallery, where `region_where` scans the decoded pixels,
# at opt-level 1, not 3. One decode and scan of a 3840x2160 screenshot took
# 7 ms at opt-level 3, 32 ms at 1 and 117 ms at 0 on the Desktop. But opt-level
# 3 applies to each of the harness's test binaries too, and rebuilding the
# workspace on two CPUs took 49 s at opt-level 3 (or 2), 16 s at 1 and 7 s at 0:
# about two minutes of every CI run (ticket #55).
[profile.dev.package.test-harness]
opt-level = 1

[profile.dev.package.automation]
opt-level = 1

# Line tables only for our crates, enough for file and line in a backtrace,
# and no debuginfo for dependencies. A cold build of every target on two CPUs
# took 126 s with full debuginfo, 102 s with line tables only and 89 s with
# none; relinking after a change to the harness took 73, 46 and 41 s; and the
# target directory, which CI's cache restores and saves on every run, was 2.8,
# 1.7 and 0.9 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
