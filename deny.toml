# cargo-deny: every dependency must be compatible with GPL-3.0-or-later, free
# of known advisories, and come from crates.io. `just check` runs it.

[graph]
all-features = true

[advisories]
# Unmaintained crates and yanked versions fail too, not only vulnerabilities.
unmaintained = "all"
yanked = "deny"

[licenses]
# Each of these can be combined into a GPL-3.0-or-later program.
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9
# The list anticipates GTK and D-Bus dependencies; an unused entry is fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
